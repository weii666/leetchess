[project]
name = "leetchess"
version = "0.1.0"
description = "象棋排局挑戰平台的後端引擎服務"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # fastapi.testclient.TestClient 的 HTTP 傳輸層;starlette 已棄用搭配 httpx(1.x),
    # 改用 httpx2 才不會在每次 TestClient 匯入時發出 StarletteDeprecationWarning。
    "httpx2>=2.9",
    "playwright>=1.62.0",
    # `dev.sh` 的自動重啟。**沒有它,uvicorn 的 --reload-include 完全無效** ——
    # 會退回只看 *.py 的 StatReload,改題目檔不重啟,而那正是 dev.sh 要解的事。
    # uvicorn 只在啟動時印一行 WARNING 說明,漏裝很容易被當成「reload 壞了」。
    "watchfiles>=1.2.0",
]

[tool.pytest.ini_options]
# 專案以非套件模式管理,service/ 不會被安裝進 .venv。
# 將專案根加入 sys.path,測試才能 `import service`。
pythonpath = ["."]

# `mutants/` 是 mutmut 產出的整份專案副本,裡面有一份 `tests/conftest.py` 的複本。
# 不排除的話,跑完變異測試之後單純的 `uv run pytest` 會因為同一個 `--slow` 選項被
# 註冊兩次而整個中止,錯誤訊息(`option names {'--slow'} already added`)完全看不出
# 與 mutmut 有關。
norecursedirs = ["mutants", ".venv", "web", "poc"]

# 少數測試必須真的等滿某個逾時上界才有意義,無法靠縮短參數加速。它們在開發期
# 每次跑都在浪費等待,故預設排除;上線前與 CI 以 `--slow` 跑完整套。
#
#   uv run pytest            平時開發:跳過
#   uv run pytest --slow     完整驗證:全跑
addopts = "-m 'not slow'"
markers = [
    "slow: 需要真的等滿逾時上界的測試,預設跳過,加 --slow 才跑",
]

[tool.mutmut]
# 變異測試:曾經拿來當「這個測試刪不刪得掉」的判準——刪掉它不會讓任何一個
# 變異體從被殺變成存活,才准刪(不是看覆蓋率:覆蓋率不看斷言強度)。
#
#   uv run --with mutmut mutmut run        產生並執行全部變異體(約 30 分鐘)
#   uv run --with mutmut mutmut results    列出存活(=沒有任何測試抓得到)的變異體
#
# mutmut 不列入 dev 依賴,以 `--with` 臨時取得 —— 它不是跑測試的必要條件,只在
# 檢討測試強度時才用得到。
#
# `also_copy` 必須列出 positions/、engine/、web/:mutmut 把專案複製到 `mutants/`
# 之後在該目錄下執行,而 `service/config.py` 的 PROJECT_ROOT 取自 `__file__`,
# 因此解析到的是副本的根。少了任何一個,對應的測試會在副本裡整批失敗。
#
# `service/game.py` 排除在外的理由見下方註記。
source_paths = ["service"]
also_copy = ["positions", "engine", "web"]

# 已知的測量誤差:`engine/pool.py` 與 `engine/process.py` 的逾時與併發測試對時序
# 敏感,同一個變異體在不同次執行可能被判為殺或存活。實測誤差約 ±3 個變異體,而且
# 出現過「測試變少反而多殺」這種邏輯上不可能的結果。這兩個模組的存活清單要當成
# 有雜訊的量測,不是精確值;判斷某個變異體是否真的殺不掉,請用固定的
# MUTANT_UNDER_TEST 單獨重跑確認,不要只看一次全量結果。

[tool.uv]
# 明確宣告非套件模式:uv sync 只安裝依賴,不建置本專案本身。
# 無 [build-system] 時 uv 本來就預設如此,此處只是把意圖寫明。
package = false
