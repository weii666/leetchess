[project]
name = "leetchess"
version = "0.1.0"
description = "象棋排局挑戰平台的後端引擎服務"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # fastapi.testclient.TestClient 的 HTTP 傳輸層;starlette 已棄用搭配 httpx(1.x),
    # 改用 httpx2 才不會在每次 TestClient 匯入時發出 StarletteDeprecationWarning。
    "httpx2>=2.9",
    "playwright>=1.62.0",
    # `dev.sh` 的自動重啟。**沒有它,uvicorn 的 --reload-include 完全無效** ——
    # 會退回只看 *.py 的 StatReload,改題目檔不重啟,而那正是 dev.sh 要解的事。
    # uvicorn 只在啟動時印一行 WARNING 說明,漏裝很容易被當成「reload 壞了」。
    "watchfiles>=1.2.0",
]

[tool.pytest.ini_options]
# 專案以非套件模式管理,service/ 不會被安裝進 .venv。
# 將專案根加入 sys.path,測試才能 `import service`。
pythonpath = ["."]

# 少數測試必須真的等滿某個逾時上界才有意義,無法靠縮短參數加速。它們在開發期
# 每次跑都在浪費等待,故預設排除;上線前與 CI 以 `--slow` 跑完整套。
#
#   uv run pytest            平時開發:跳過
#   uv run pytest --slow     完整驗證:全跑
addopts = "-m 'not slow'"
markers = [
    "slow: 需要真的等滿逾時上界的測試,預設跳過,加 --slow 才跑",
]

[tool.uv]
# 明確宣告非套件模式:uv sync 只安裝依賴,不建置本專案本身。
# 無 [build-system] 時 uv 本來就預設如此,此處只是把意圖寫明。
package = false
