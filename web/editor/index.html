<!--
  收題工具的頁面。**這是題庫維護者的工具,不是產品功能。**

  ## 為什麼是 `web/editor/index.html`

  收題頁的檔案集中在這一個目錄裡(design 的 File Structure Plan):版面、樣式、
  組裝與純函式全都住在此,與 `web/` 底下的產品頁面互不牽動。**服務端因此一個字
  都不必改** —— `service/main.py` 以 `StaticFiles(html=True)` 把 `web/` 掛在根
  路徑上,目錄請求會落到該目錄的 `index.html`,`/editor/` 這個位址完全由檔案佈局
  決定。既有的靜態檔掛載規則(含 `_WebFiles` 對 `/api` 的遮蔽)一律不變:收題頁
  是普通靜態內容,不需要任何特殊待遇。

  換句話說,**把這個檔案搬走或改名,這個工具就消失了** —— 沒有任何一條路由指著
  它。`tests/test_web_editor_page.py` 釘住的就是這件事。

  ## 這一頁刻意沒有入口,也刻意沒有存取控制

  題庫列表頁與對局頁**不得**加上任何指向本頁的連結、按鈕或其他入口(requirement
  1.2,由 `tests/test_web_editor_entry.py` 反向釘住)。網址是唯一的到達方式,而
  這正是要的:一般使用者不會在產品的導覽動線上誤入維護工具。

  沒有入口**不等於**這是防護手段,兩者不可混為一談。本頁不設任何存取控制,理由是
  它根本沒有能力可濫用:寫檔一律在瀏覽器端進行,寫得到的只有使用者自己以系統對話
  框選定的本機目錄,**伺服器的題庫碰不到** —— 服務端不存在任何寫入題庫的程式碼
  路徑,上線題庫只經由 git commit 進版本庫(design 的 Security Considerations)。
  因此不要為了「保護」這一頁而回頭加開關或登入:那擋不到本來就不存在的能力,卻會
  讓本機開發多一道沒有意義的手續。

  ## 本檔只有容器,沒有邏輯

  與對局頁同一個形態:這裡擺出的是「有哪些格子」,不是「按下去會怎樣」。行為一律
  住在 `./editor.js`(tasks 4.2 起,掛在本檔末端;欄位互動與難度選項屬 4.3、寫入流程
  屬第 5 組),那幾個任務**都改得到本檔** —— 但改的是**容器**:要新的格子就在這裡
  宣告出來,由那一支模組去填,而不是由 JS 生一個節點插進來。訊息槽
  (`[data-message-for]`)與不支援的說明(`#unsupported`)都是這個形態。

  掛的 `<script>` **就是末端那一個**,後續任務接著擴充 `editor.js` 而不是再掛一支:
  兩支模組各自查 DOM、各自接事件,誰先跑、誰蓋掉誰就會變成一件要記在腦子裡的事。

  沒有 JavaScript 時,本檔仍是一份完整的表單容器:七個欄位照樣打得了字,盤面那一格
  留著 `.board-placeholder` 的說明。**但盤面要有 JS 才畫得出來**(2.1)。

  ## 這個工具只新增,不改也不刪(requirement 7.6)

  DOM 中不存在任何編輯或刪除既有題目的控制項,而且這是**硬邊界而非還沒做**:寫檔
  一律是「把新的一題追加到檔案文字末端」(`corpus-file.js`),既有題目逐字不動。
  要修既有題目請直接改題目檔並走 git —— 在這裡長出一顆「改這一題」的按鈕,等於讓
  一個瀏覽器端工具擁有覆寫題庫的能力,而那正是整個設計避開的東西。
  `tests/test_web_editor_layout.py` 以字眼黑名單掃 DOM 反向釘住這條邊界。
-->

<!--
  平台不支援時的說明(requirement 6.3)。**位置固定、預設隱藏、文字是靜態的。**

  三件事各有理由:

  1. **位置固定且在表單之前。** 一段「這個瀏覽器寫不了檔」的話擺在表單底下,等於
     等使用者把七個欄位填完才說。
  2. **預設隱藏,由 tasks 5.3 掀開。** `fs.js` 的 `isSupported()` 在載入當下就評估
     得出來,因此這一段不會在使用者操作到一半時忽然冒出來推動版面 —— 對局頁的
     等待區塊正是栽在那件事上,已整條移除。`editor.css` 的
     `[hidden] { display: none !important }` 保住這個預設值:任何給它 `display`
     的版面規則都會讓這段話對**支援的**瀏覽器也永遠掛在畫面上,而那是絕大多數。
     少了那個預設值,盤面也會被它往下推(見上一段)。
  3. **文字寫在這裡而不是由 JS 產生。** 說法是靜態的,5.3 只負責拿掉 `hidden`。
     說法要與 `fs.js` 的 `UnsupportedBrowserError` 一致 —— 兩處講的是同一件事,
     使用者不該因為觸發路徑不同而讀到兩種說法。

  內容要**說得出原因**,不是一句「無法使用」:講清楚是瀏覽器缺了寫入本機檔案的
  能力,使用者才知道下一步是換一個瀏覽器,而不是回頭檢查自己填了什麼。
-->

  ## 這裡沒有的兩個欄位

  - **最長殺著距離(3.4)**:由驗證工具回填(屬 corpus-verification),不是人填的。

-->

      requirement 2.4 要的是「顯示無法解析的訊息**且**不繼續顯示前一個局面」,同源
      才不可能各說各話。

      空著時這一格不出聲,與其餘六欄同一條規則(`editor.js` 的 `renderMessages`):
      還沒填不是填錯。這一欄的安靜另有 requirement 2.5 直接要求 —— 清空 FEN 呈現的是
      空盤面而不是錯誤。那一項未通過並沒有消失:寫入照樣停用,而「是哪一項」由寫入
      操作旁邊的 `#write-note` 點名(8.4)。
    -->
    <p class="field-issue" data-message-for="fen" hidden></p>
    <!--

  </div>


  <div class="field">
    <label for="field-difficulty">難度</label>

      <label for="field-tags">標籤</label>

      預設值是「連將殺」:題庫裡絕大多數題目是連將殺,一題一題重打同三個字是純粹的

  <!--
    存檔位置的選定(requirements 5.1、5.10、5.11)與寫入操作(4.1、8.4)。

    ## 說法是「存檔位置」而不是「目標題目檔」

    後者是 requirements 與 design 裡的說法,寫在文件裡精確,唸出來卻饒舌 —— 而這一格
    問的其實就是「這一題要存到哪」。兩顆按鈕跟著收短成「選擇檔案」與「寫入」:
    上下文已經整頁都在講題目檔,每一顆按鈕再重複一次「題目檔」三個字只是雜訊。
    `editor.js` 的 `NO_FILE_NOTE` 與 `DENIED_NOTE` 指路時提的也是「選擇檔案」,
    畫面上按鈕叫什麼、訊息裡就說什麼。
    **兩顆按鈕排同一行,自左而右並肩**(版面規則見 `editor.css` 的 `#action-row`)。

    ## 為什麼是一顆按鈕而不是一個路徑輸入框

    這裡原本是 `#field-target` —— 一個手打相對路徑的輸入框。人工驗收時發現它反直覺:
    系統對話框問的是「哪個資料夾」,而畫面問的是「哪個檔案」,同一件事被拆成兩個
    步驟問兩次。改成直接選那一個 `.json` 之後,**打錯路徑寫到別的檔**這個最危險的
    失敗模式在構造上不再存在,而授權範圍也從整個題庫目錄縮到單一檔案。

    ## 它刻意不在寫入序列裡

    選檔是使用者主動按下的一個獨立操作。平台要求檔案選擇框開在使用者手勢的呼叫堆疊
    內,而舊設計把授權排在撞號與驗證之後 —— 那幾步是 `await` 過的網路請求,實測手勢
    的有效期只有約 5 秒,一次引擎池滿就會讓對話框開不起來。獨立成一顆按鈕之後,那個
    缺口構造上不再發生。

    ## 兩顆按鈕並肩,而不是推到一行的兩端

    它們是收題的最後兩步、照左而右的順序做:先選檔,再寫入。推到兩端的話中間空出
    一大片,兩顆按鈕看起來像分屬兩個不同的區塊 —— 而它們是同一件事的兩步。並肩也
    讓兩顆的上下緣對得起來(高度由 `editor.css` 的 `align-items: stretch` 拉齊,
    兩顆的內距本來不同)。

    這一行**不含**檔名與停用說明:那兩段字各自會長短不一,擠進按鈕那一行就會把它
    推高。它們排在按鈕底下,見下方。

    ## 這顆寫入按鈕預設是停用的

    欄位沒填妥的表單過不了淺層檢查,載入當下停用是**正確的初始狀態**而不是保守
    起見。寫在 HTML 裡也讓沒有 JavaScript 時的樣子是誠實的:那時什麼都寫不了。
    `type="button"` 是必要的:容器雖然是 `<section>` 而非 `<form>`,但寫死型別才不會
    在日後有人改用 `<form>` 時變成一顆送出鈕。
  -->
  <div class="field">
    <span class="field-label">存檔位置</span>

    <div id="action-row">
      <button id="pick-file" type="button">選擇檔案</button>
      <button id="write" type="button" disabled>寫入</button>
    </div>

    <!--
      選定的檔名,**排在按鈕正下方**。

      它曾經搭在抬頭那一行的右端,與提示同一個位置 —— 而它不是提示:提示是「這一格
      怎麼填」,這一句是「現在選的是哪一個檔」,是一個會變的狀態。擺在右上角時它離
      那顆改變它的按鈕最遠,看起來像飄在那裡的一段字;排在按鈕底下,按一次就在原地
      換一次,兩者的因果一眼看得出來。

      位置固定,與訊息槽同一條規矩:節點自始就在,`editor.js` 只寫內容。尚未選定時
      它說的是「尚未選定」而不是空白 —— 一個空白的位置看起來像壞掉,而這是一個必要
      的步驟。
    -->
    <p class="field-hint" id="selected-file"></p>
    <p class="field-issue" data-message-for="target" hidden></p>
  </div>

  <p id="write-note" hidden></p>
</section>
