<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>象棋排局挑戰</title>
<link rel="icon" href="./favicon.svg">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<!--
  本檔只有容器,沒有互動邏輯也沒有樣式:內容由 app.js 填入(tasks 4.3、4.4),
  版面由 style.css 決定(tasks 5.1)。那兩個任務的 boundary 都碰不到本檔,
  因此每一個容器都必須在此一次備齊。
-->
<main id="board" aria-label="棋盤"></main>

<aside id="sidebar">
  <section id="puzzle-info">
    <h1 id="puzzle-title">載入中…</h1>
    <!--
      這一行 meta 現在**只剩出處**(使用者看過實際畫面後的決定)。

      原本是三行「出處:…／描述:…／最長殺著距離:…」。描述是「出處 + 局號 + 局名」
      的串接,與上面的 h1 和出處完全重複,先被整條移除(problem-browser 4.5);
      最長殺著這一輪也整組拿掉 —— **它對使用者是劇透**:預告這題幾步殺得完,而排局
      練習的價值正在於自己找出殺法。連帶移除的是 `#puzzle-max-dtm`、分隔點 `·`,
      以及「最長殺著」四個字。web-play-runtime 的 requirement 1.3 已隨之推翻。

      後端**沒有改**:`GET /api/positions/{id}` 照常回 `max_dtm`(那是資料契約,
      corpus-verification 要回填它),只是前端不再顯示。
    -->
    <p id="puzzle-meta"><span id="puzzle-source">—</span></p>
  </section>

  <!--
    當前輪方須對使用者可辨識(8.4)。這一格只放這一件事,故**不帶「輪方:」那種
    名目**(使用者看過實際畫面後的決定)——「輪到你」本身就是完整的句子,名目只是
    每次重畫都再說一遍的廢話。沒有題目時填佔位符號,由 `app.js` 覆寫。
  -->
  <p id="turn">—</p>

  <!--
    三態諮詢信號。它是參考資訊而非勝負判決(4.4),故標為 note 而非 status:
    對局是否結束只看後端回應,信號為任何值都不得使對局提早停下。
    **`role` 不得改成 `status`** —— 4.4 的語意層就靠這一個屬性。
  -->
  <section id="signal" role="note">勝負難料</section>

  <!-- 等待後端回應期間呈現,回應或失敗後皆解除(6.1、6.4)。 -->
  <p id="waiting" hidden>引擎思考中…</p>

  <!--
    錯誤以單一通用區塊呈現,不為每種錯誤各做一套 UI(design 的 Error Handling);
    區分只需到「可重試」與「須重來」兩類,兩者共用這一個位置。
  -->
  <p id="error" role="alert" hidden></p>

  <!--
    對局的控制項。「重來」永遠在;「下一題」由 `app.js` 動態接進來,而且**只在
    使用者獲勝之後**出現(problem-browser 的跨題導航)。兩者並排,故需要一個
    共同的容器 —— 沒有它的話,一個 `<button>` 與一個 `<a>` 靠行內排版對齊,
    高度與基線都得各自湊。
  -->
  <div id="controls">
    <button id="reset" type="button">重來</button>
  </div>

  <section id="moves-panel">
    <h2>歷史著法</h2>
    <ol id="moves"></ol>
  </section>
</aside>

<script type="module" src="./app.js"></script>
</body>
</html>
