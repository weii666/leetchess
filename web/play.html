<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>象棋排局挑戰</title>
<link rel="icon" href="./favicon.svg">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<!--
  本檔只有容器,沒有互動邏輯也沒有樣式:內容由 app.js 填入(tasks 4.3、4.4),
  版面由 style.css 決定(tasks 5.1)。那兩個任務的 boundary 都碰不到本檔,
  因此每一個容器都必須在此一次備齊。
-->
<main id="board" aria-label="棋盤"></main>

<aside id="sidebar">
  <section id="puzzle-info">
    <h1 id="puzzle-title">載入中…</h1>
    <!--
      這一行 meta 現在**只剩出處**(使用者看過實際畫面後的決定)。

      原本是三行「出處:…／描述:…／最長殺著距離:…」。描述是「出處 + 局號 + 局名」
      的串接,與上面的 h1 和出處完全重複,先被整條移除(problem-browser 4.5);
      最長殺著這一輪也整組拿掉 —— **它對使用者是劇透**:預告這題幾步殺得完,而排局
      練習的價值正在於自己找出殺法。連帶移除的是 `#puzzle-max-dtm`、分隔點 `·`,
      以及「最長殺著」四個字。web-play-runtime 的 requirement 1.3 已隨之推翻。

      後端**沒有改**:`GET /api/positions/{id}` 照常回 `max_dtm`(那是資料契約,
      corpus-verification 要回填它),只是前端不再顯示。
    -->
    <!--
      題目資訊是兩行:出處自成一行,難度與標籤同一行。

      ## 標籤預設隱藏,要按一下才展開

      **殺法名是劇透。** 「雙馬飲泉」「鐵門栓」「小鬼坐龍廷」等於直接告訴使用者這一
      題的解法,而排局練習的價值正在於自己找出殺法 —— 與最長殺著距離被整組移除的理由
      完全相同(見上方 `#puzzle-meta` 那段)。差別只在最長殺著沒有任何使用情境,而
      標籤在卡住時是有用的提示,故保留但**要使用者主動要求**。

      因此:**不要因為「資料都有了」就把它改成預設展開。** 那不是精簡點擊數,是把
      這一頁的價值拿掉。

      展開狀態**刻意不做持久化**(不存 localStorage):它是提示而不是偏好設定,上一題
      按過展開,不該讓下一題一開啟就洩題。每一題都從隱藏開始。

      沒有標籤的題目連按鈕都不出現 —— 按下去什麼都沒有的按鈕比沒有按鈕更難解釋。

      ## 共用

      說法、顏色與 chip 外觀都與列表共用:`web/difficulty.js` 出難度的說法與退路,
      `style.css` 與 `list.css` 共用難度三色與 `--tag-bg`(`tests/test_web_list.py`
      的 `SHARED_CUSTOM_PROPERTIES` 比對兩頁的值)。**字級不共用** —— 列表是密集的
      掃視表格,側欄是詳情面板,同一個尺寸在兩邊不會都對。
    -->
    <p id="puzzle-meta"><span id="puzzle-source">—</span></p>
    <p id="puzzle-attrs">
      <span id="puzzle-difficulty" hidden></span>
      <button id="toggle-tags" type="button" aria-expanded="false"
              aria-controls="puzzle-tags" hidden>顯示標籤</button>
      <span id="puzzle-tags" hidden></span>
    </p>
  </section>

  <!--
    當前輪方須對使用者可辨識(8.4)。這一格只放這一件事,故**不帶「輪方:」那種
    名目**(使用者看過實際畫面後的決定)——「輪到你」本身就是完整的句子,名目只是
    每次重畫都再說一遍的廢話。沒有題目時填佔位符號,由 `app.js` 覆寫。

    **等待中的回饋也由這一行承擔**(requirement 6.1 修訂後):等應手的期間它顯示
    「黑方走棋」,那句話本身就在說「現在不是你動」。這一格**位置固定、只換字不換
    高度**,所以它擔起等待呈現不會推動下面的任何東西。
  -->
  <p id="turn">—</p>

  <!--
    三態諮詢信號。它是參考資訊而非勝負判決(4.4),故標為 note 而非 status:
    對局是否結束只看後端回應,信號為任何值都不得使對局提早停下。
    **`role` 不得改成 `status`** —— 4.4 的語意層就靠這一個屬性。

    靜態初值原本是 POC 沿用下來的「勝負難料」,已改為與 `app.js` 一致的「勝負未知」。
    那一格在 JS 接手前就會被使用者看見(載入題目的那段時間),兩處用詞不同的話,
    畫面會在無人操作的情況下自己換一次說法。用詞的取捨見 `app.js` 的 `NO_SIGNAL_YET`。
  -->
  <section id="signal" role="note">勝負未知</section>

  <!--
    這裡曾有一個 `<p id="waiting" hidden>引擎思考中…</p>`。**已整條移除**(使用者
    看過實際畫面後的決定)。

    它是版面流裡的一個區塊,顯示與隱藏都會把底下的「歷史著法」上下推動 —— 每走
    一手就抖一次,而抖動的正是使用者當下最想看的那一區。等待資訊本來就有備份:
    等待期間 `#turn` 顯示「黑方走棋」,已經說了「現在不是你動」,那個藍方塊是把
    同一件事再說一遍。

    誠實記錄代價:等待期間的回饋**從一個專用區塊降級成 `#turn` 那一行的文字** ——
    比原本弱,但換來版面不抖。requirement 6.1 已隨之修訂。

    **6.2(等待中不接受走子)與 6.4(等待態必解除)與這個區塊無關,兩條都仍然
    成立**:前者由 `game.js` 的 `acceptsMoves` 擋住(等待中 `legalMoves` 為空,
    盤面整片不可選),後者由快照的 `waiting` 翻回假承擔。
  -->

  <!--
    錯誤以單一通用區塊呈現,不為每種錯誤各做一套 UI(design 的 Error Handling);
    區分只需到「可重試」與「須重來」兩類,兩者共用這一個位置。
  -->
  <p id="error" role="alert" hidden></p>

  <!--
    對局的控制項。「重來」永遠在;「下一題」由 `app.js` 動態接進來,而且**只在
    使用者獲勝之後**出現(problem-browser 的跨題導航)。兩者並排,故需要一個
    共同的容器 —— 沒有它的話,一個 `<button>` 與一個 `<a>` 靠行內排版對齊,
    高度與基線都得各自湊。
  -->
  <div id="controls">
    <button id="reset" type="button">重來</button>
  </div>

  <!--
    標題是「著法記錄」而不是「歷史著法」。後者的「歷史」是名詞修飾,讀起來像「古代
    的著法」,而這一區其實是「本局走過的著法」。「著法」是象棋對一步棋的正式說法,
    「記錄」點出它是一份逐手的清單。

    **規格文件仍以「歷史著法」稱呼這一區**(`.kiro/specs/web-play-runtime/` 與
    `problem-browser/` 共七份,程式與測試的註解亦然)。那是功能的名字,這裡改的只是
    使用者看到的標籤 —— 兩者不必同名,但看到這行差異時不必懷疑是誰漏改了。
  -->
  <section id="moves-panel">
    <h2>著法記錄</h2>
    <ol id="moves"></ol>
  </section>
</aside>

<script type="module" src="./app.js"></script>
</body>
</html>
